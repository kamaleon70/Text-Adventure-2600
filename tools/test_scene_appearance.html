<!doctype html>
<meta charset="utf-8">
<title>Scene appearance editor smoke test</title>
<pre id="result">RUNNING</pre>
<iframe id="editor" src="../.itch-f4-smoke/index.html" style="width:1600px;height:1000px;border:0"></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#editor");
  const fail = (message) => { result.textContent = `FAIL: ${message}`; fetch(`/__scene_appearance__/FAIL/${encodeURIComponent(message)}`).catch(() => {}); };
  frame.addEventListener("load", () => {
    const started = Date.now();
    const waitForEditor = setInterval(() => {
      const document = frame.contentDocument;
      const build = document?.querySelector("#build-download");
      if (!build || build.disabled) {
        if (Date.now() - started > 15000) { clearInterval(waitForEditor); fail("editor did not become ready"); }
        return;
      }
      clearInterval(waitForEditor);
      document.querySelector('[data-tab="appearance"]').click();
      document.querySelector("#appearance-preset-add").click();
      const presetBackground = document.querySelector('[data-preset-appearance="background_color"]');
      if (!presetBackground) return fail("appearance preset controls were not created");
      presetBackground.value = "34";
      presetBackground.dispatchEvent(new Event("change", { bubbles: true }));
      document.querySelector('[data-tab="page"]').click();
      let toggle = document.querySelector('[data-scene-appearance-toggle="background_color"]');
      toggle.checked = true;
      toggle.dispatchEvent(new Event("change", { bubbles: true }));
      let select = document.querySelector('[data-scene-appearance="background_color"]');
      select.value = "68";
      select.dispatchEvent(new Event("change", { bubbles: true }));
      const roomPreset = document.querySelector("#room-appearance-preset");
      if (!roomPreset || roomPreset.options.length < 2) return fail("room preset selector is missing");
      roomPreset.value = "theme_1";
      roomPreset.dispatchEvent(new Event("change", { bubbles: true }));
      toggle = document.querySelector('[data-scene-appearance-toggle="background_color"]');
      select = document.querySelector('[data-scene-appearance="background_color"]');
      if (!toggle || !select || toggle.checked || !select.disabled || select.value !== "34") return fail("room preset did not replace the first scene override");
      if (!document.body.classList.contains("page-editor-active") || getComputedStyle(document.querySelector("#page-list")).overflowY !== "auto" || getComputedStyle(document.querySelector(".page-workspace")).overflowY !== "auto") return fail("room list and scene editor do not scroll independently");
      document.querySelector('[data-tab="appearance"]').click();
      document.querySelector("#appearance-preset-add").click();
      const scenePresetBackground = document.querySelector('[data-preset-appearance="background_color"]');
      scenePresetBackground.value = "68";
      scenePresetBackground.dispatchEvent(new Event("change", { bubbles: true }));
      document.querySelector('[data-tab="page"]').click();
      const scenePreset = document.querySelector("#scene-appearance-preset");
      scenePreset.value = "theme_2";
      scenePreset.dispatchEvent(new Event("change", { bubbles: true }));
      toggle = document.querySelector('[data-scene-appearance-toggle="background_color"]');
      select = document.querySelector('[data-scene-appearance="background_color"]');
      if (!select.disabled || select.value !== "68") return fail("scene theme did not override the room theme");
      toggle.checked = true;
      toggle.dispatchEvent(new Event("change", { bubbles: true }));
      select = document.querySelector('[data-scene-appearance="background_color"]');
      if (select.disabled || !document.querySelector("#scene-appearance-count").textContent.includes("1 custom")) return fail("custom scene control was not enabled");
      select.value = "34";
      select.dispatchEvent(new Event("change", { bubbles: true }));
      document.querySelector("#scene-appearance-reset").click();
      select = document.querySelector('[data-scene-appearance="background_color"]');
      if (!select.disabled || select.value !== "34" || document.querySelector("#scene-appearance-preset").value !== "" || document.querySelector("#scene-appearance-count").textContent !== "Inherits room") return fail("reset did not restore room inheritance");
      const ending = document.querySelector("#scene-ending");
      if (getComputedStyle(ending.parentElement).alignSelf !== "end" || getComputedStyle(ending.parentElement).marginBottom !== "0px") return fail("ending checkbox is not aligned with the scene fields");
      ending.checked = true;
      ending.dispatchEvent(new Event("change", { bubbles: true }));
      if (document.querySelector("#editor-action-row").textContent !== "FIRE:RESTART") return fail("ending action-row preview is incorrect");
      document.querySelector('[data-tab="play"]').click();
      if (document.querySelector("#play-action").textContent !== "FIRE:RESTART" || document.querySelectorAll("#play-actions button").length !== 1) return fail("playtest did not restrict the ending scene to Restart");
      document.querySelector('[data-tab="manual"]').click();
      const manualCards = document.querySelectorAll(".manual-card[data-manual-guide]");
      const detailLinks = document.querySelectorAll(".manual-detail-link");
      if (manualCards.length !== 15 || detailLinks.length !== manualCards.length) return fail("not every manual section has a detailed guide");
      detailLinks[0].click();
      if (document.querySelector("#manual-detail").classList.contains("hidden") || document.querySelector("#manual-detail-title").textContent !== "Start your adventure") return fail("detailed manual page did not open");
      document.querySelector("#manual-detail .manual-back").click();
      if (!document.querySelector("#manual-detail").classList.contains("hidden") || document.querySelector(".manual-layout").classList.contains("hidden")) return fail("manual Back button did not restore the index");
      if (document.querySelector("#room-id") || document.querySelector("#scene-id")) return fail("internal room or scene IDs are still visible");
      const editorWindow = frame.contentWindow;
      editorWindow.confirm = () => true;
      editorWindow.alert = () => {};
      document.querySelector("#new-project").click();
      let project = editorWindow.TextAdventureEditor.getProject();
      if (project.rooms.length !== 1 || project.rooms[0].name !== "Start Room" || project.rooms[0].scenes.length !== 1) return fail("New project did not create a clean one-room adventure");
      document.querySelector("#add-room").click();
      const roomName = document.querySelector("#room-name");
      roomName.value = "Start Room";
      roomName.dispatchEvent(new Event("change", { bubbles: true }));
      project = editorWindow.TextAdventureEditor.getProject();
      if (project.rooms[1].name === "Start Room" || roomName.value === "Start Room") return fail("duplicate room name was accepted");
      result.textContent = "PASS: room/scene themes, independent scrolling, checkbox alignment, hidden IDs, unique names, New project, endings, and manual links work";
      fetch("/__scene_appearance__/PASS").catch(() => {});
    }, 100);
  });
</script>
